<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a626e"/><stop offset="1" stop-color="#424852"/></linearGradient>
<linearGradient id="bodyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#424852"/><stop offset="1" stop-color="#2c3138"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fa6d6"/><stop offset=".45" stop-color="#1b2f4d"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset=".5" stop-color="#cfd5dd"/><stop offset="1" stop-color="#98a0ab"/></linearGradient>
<radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>

</defs>
<rect width="640" height="640" fill="#ffffff"/>
<ellipse cx="320.0" cy="548" rx="190" ry="26" fill="url(#shadow)"/>
<g transform="translate(320 312) scale(1.16)">

  <!-- 手柄 -->
  <rect x="-46" y="18" width="92" height="150" rx="26" fill="url(#bodyD)"/>
  <rect x="-20" y="30" width="40" height="66" rx="12" fill="#20242a"/>
